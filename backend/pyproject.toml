[project]
name = "api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
# fastapi: the framework. uvicorn: serves it. httpx: calls Supabase and the LLM.
# pydantic-settings: reads the root .env.
dependencies = [
    "fastapi",
    "uvicorn",
    "httpx",
    "asyncpg>=0.30.0",
    "PyJWT[crypto]>=2.10.1",
    "pydantic-settings",
    "tzdata>=2026.6",
]

[dependency-groups]
dev = ["pytest"]
# Offline ML only. The API never imports these.
# CUDA PyTorch on Windows and Linux; MLX on Apple Silicon macOS.
ml = [
    "numpy>=2.5.4",
    "torch>=2.11.0; sys_platform == 'win32' or sys_platform == 'linux'",
    "mlx>=0.29; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["."]
